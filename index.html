<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик онлайна</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f5f5f5; }
        .counter { font-size: 96px; font-weight: bold; color: #2e7d32; line-height: 1; }
        .label { font-size: 20px; color: #555; margin-top: 10px; }
        .status { margin-top: 30px; font-size: 14px; color: #888; }
    </style>
</head>
<body>
    <div class="counter" id="count">0</div>
    <div class="label">человек онлайн</div>
    <div class="status" id="myStatus">подключение...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, onDisconnect, serverTimestamp, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpjhSWwkfyMNPKgtg6hJIbQ5F9mf61N48",
            authDomain: "test-64db2.firebaseapp.com",
            databaseURL: "https://test-64db2-default-rtdb.firebaseio.com",
            projectId: "test-64db2",
            storageBucket: "test-64db2.firebasestorage.app",
            messagingSenderId: "171063133481",
            appId: "1:171063133481:web:dc2f7eb0b5f13c2ebc6338",
            measurementId: "G-DF203GV4XE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const SESSION_ID = 'u_' + Math.random().toString(36).substring(2, 10);
        const myRef = ref(db, '/online/' + SESSION_ID);
        const onlineRef = ref(db, '/online');
        const connectedRef = ref(db, '.info/connected');

        const countDiv = document.getElementById('count');
        const statusDiv = document.getElementById('myStatus');

        onValue(connectedRef, (snap) => {
            if (snap.val() === false) {
                statusDiv.textContent = 'нет соединения с Firebase';
                return;
            }
            onDisconnect(myRef).remove().then(() => {
                set(myRef, { joined: serverTimestamp() });
                statusDiv.textContent = 'вы в сети';
            });
        });

        onValue(onlineRef, (snap) => {
            const data = snap.val();
            countDiv.textContent = data ? Object.keys(data).length : 0;
        });

        window.addEventListener('beforeunload', () => { remove(myRef); });
    </script>
</body>
</html>
